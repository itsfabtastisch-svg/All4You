<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 430" role="img" aria-label="All4You Service München Illustration">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f8fcff"/>
      <stop offset=".65" stop-color="#eaf5fb"/>
      <stop offset="1" stop-color="#dceff6"/>
    </linearGradient>
    <linearGradient id="teal" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#16c6b7"/>
      <stop offset="1" stop-color="#078179"/>
    </linearGradient>
    <linearGradient id="blue" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#155a9e"/>
      <stop offset="1" stop-color="#0f2f52"/>
    </linearGradient>
    <linearGradient id="softBlue" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#bcd5e8" stop-opacity=".74"/>
      <stop offset="1" stop-color="#8caec8" stop-opacity=".26"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-30%" width="140%" height="170%">
      <feDropShadow dx="0" dy="12" stdDeviation="10" flood-color="#10243b" flood-opacity=".18"/>
    </filter>
    <filter id="softShadow" x="-30%" y="-40%" width="160%" height="190%">
      <feDropShadow dx="0" dy="8" stdDeviation="7" flood-color="#10243b" flood-opacity=".16"/>
    </filter>
  </defs>

  <rect width="920" height="430" rx="58" fill="url(#bg)"/>
  <ellipse cx="520" cy="220" rx="390" ry="205" fill="#ffffff" opacity=".52"/>
  <circle cx="780" cy="94" r="72" fill="#0aa99b" opacity=".10"/>
  <circle cx="812" cy="95" r="116" fill="#0aa99b" opacity=".055"/>

  <!-- Munich skyline -->
  <g opacity=".34" fill="url(#softBlue)">
    <path d="M70 246h780v25H70z"/>
    <rect x="105" y="158" width="42" height="88" rx="14"/>
    <rect x="166" y="124" width="48" height="122" rx="14"/>
    <path d="M181 124c9-30 18-30 27 0z"/>
    <rect x="238" y="176" width="54" height="70" rx="10"/>
    <rect x="329" y="140" width="118" height="106" rx="10"/>
    <rect x="347" y="102" width="31" height="144" rx="14"/>
    <rect x="398" y="102" width="31" height="144" rx="14"/>
    <circle cx="362.5" cy="95" r="18"/>
    <circle cx="413.5" cy="95" r="18"/>
    <rect x="507" y="166" width="44" height="80" rx="10"/>
    <rect x="588" y="124" width="40" height="122" rx="8"/>
    <path d="M608 78l20 46h-40z"/>
    <rect x="665" y="148" width="98" height="98" rx="9"/>
    <path d="M682 148l14-38 14 38zm36 0l14-50 14 50z"/>
    <rect x="818" y="78" width="10" height="168" rx="5"/>
    <path d="M793 112h60v8h-60zm14 29h32v8h-32z"/>
  </g>

  <path d="M82 337c176 15 331 15 465 0s233-14 291 0" fill="none" stroke="#c8d9e6" stroke-width="18" stroke-linecap="round"/>
  <path d="M122 321h690" stroke="#b7cbdc" stroke-width="15" stroke-linecap="round" opacity=".62"/>

  <!-- Tow truck with scooter -->
  <g transform="translate(75 138)" filter="url(#shadow)">
    <!-- scooter -->
    <g transform="translate(22 8)">
      <path d="M38 65c10-17 24-25 44-22l19 5" fill="none" stroke="#0b4e91" stroke-width="11" stroke-linecap="round"/>
      <path d="M76 41h37c12 0 21 7 25 18" fill="none" stroke="#10243b" stroke-width="9" stroke-linecap="round"/>
      <path d="M103 23c21 3 36 13 45 30" fill="none" stroke="#123b62" stroke-width="8" stroke-linecap="round"/>
      <rect x="58" y="20" width="59" height="22" rx="11" fill="#0b4e91"/>
      <path d="M126 31l10-22" stroke="#10243b" stroke-width="7" stroke-linecap="round"/>
      <circle cx="45" cy="82" r="20" fill="#fff" stroke="#10243b" stroke-width="8"/>
      <circle cx="147" cy="82" r="20" fill="#fff" stroke="#10243b" stroke-width="8"/>
      <circle cx="45" cy="82" r="7" fill="#0aa99b"/>
      <circle cx="147" cy="82" r="7" fill="#0aa99b"/>
    </g>

    <!-- truck -->
    <g transform="translate(95 86)">
      <rect x="0" y="49" width="212" height="39" rx="14" fill="#123b62"/>
      <path d="M195 18h66c22 0 42 16 48 38l8 32H195z" fill="url(#blue)"/>
      <rect x="215" y="34" width="42" height="31" rx="7" fill="#d9eef7"/>
      <rect x="273" y="57" width="37" height="31" rx="7" fill="#0f2f52"/>
      <rect x="8" y="35" width="151" height="20" rx="8" fill="#0f2f52"/>
      <circle cx="73" cy="102" r="24" fill="#fff" stroke="#10243b" stroke-width="10"/>
      <circle cx="269" cy="102" r="24" fill="#fff" stroke="#10243b" stroke-width="10"/>
      <circle cx="73" cy="102" r="8" fill="#0aa99b"/>
      <circle cx="269" cy="102" r="8" fill="#0aa99b"/>
    </g>
  </g>

  <!-- trailer -->
  <g transform="translate(482 188)" filter="url(#shadow)">
    <rect x="0" y="0" width="226" height="92" rx="8" fill="url(#teal)" stroke="#fff" stroke-width="7"/>
    <path d="M226 67h63" stroke="#10243b" stroke-width="10" stroke-linecap="round"/>
    <circle cx="112" cy="110" r="24" fill="#fff" stroke="#10243b" stroke-width="10"/>
    <circle cx="112" cy="110" r="8" fill="#0aa99b"/>
    <rect x="15" y="15" width="196" height="14" rx="7" fill="#fff" opacity=".22"/>
  </g>

  <!-- furniture / boxes -->
  <g transform="translate(644 238)" filter="url(#softShadow)">
    <rect x="112" y="41" width="88" height="61" rx="18" fill="#0aa99b"/>
    <rect x="92" y="66" width="133" height="48" rx="18" fill="#078179"/>
    <rect x="124" y="18" width="48" height="51" rx="20" fill="#14b9ac"/>
    <path d="M102 112h121" stroke="#0f2f52" stroke-width="8" stroke-linecap="round"/>
    <rect x="22" y="67" width="56" height="50" rx="6" fill="#c58b4c"/>
    <path d="M22 67l28-18 28 18m-28-18v68" fill="none" stroke="#9e672e" stroke-width="4"/>
    <rect x="65" y="80" width="48" height="38" rx="6" fill="#d6a261"/>
    <path d="M65 80l24-15 24 15" fill="none" stroke="#9e672e" stroke-width="4"/>
  </g>

  <!-- cleaning -->
  <g transform="translate(806 208)" filter="url(#softShadow)">
    <path d="M76 5l-19 128" stroke="#10243b" stroke-width="9" stroke-linecap="round"/>
    <path d="M54 129h55" stroke="#10243b" stroke-width="10" stroke-linecap="round"/>
    <path d="M98 25l36 109" stroke="#10243b" stroke-width="8" stroke-linecap="round"/>
    <path d="M111 130h48" stroke="#10243b" stroke-width="9" stroke-linecap="round"/>
    <path d="M10 84h62l-9 52H19z" fill="#dceff6" stroke="#10243b" stroke-width="8" stroke-linejoin="round"/>
    <path d="M19 84c4-30 42-30 46 0" fill="none" stroke="#0aa99b" stroke-width="8" stroke-linecap="round"/>
    <path d="M19 104h45" stroke="#0aa99b" stroke-width="5" stroke-linecap="round"/>
    <g fill="#0aa99b">
      <path d="M145 38l8 16 16 8-16 8-8 16-8-16-16-8 16-8z"/>
      <circle cx="151" cy="17" r="5"/>
    </g>
  </g>
</svg>